name: Test bundle selfcontained (bash embarque, Git simule absent)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-selfcontained.yml'
  workflow_dispatch: {}

jobs:
  test-windows-selfcontained:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: "Cache le Git for Windows deja present sur le runner (simulation PC vierge)"
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\Git") {
            Rename-Item -Path "C:\Program Files\Git" -NewName "Git_HIDDEN_FOR_TEST"
          }
          Write-Host "Git for Windows cache. bash disponible avant patch ?"
          Get-Command bash -ErrorAction SilentlyContinue

      - name: "Telecharge le bundle selfcontained (avec bash portable embarque)"
        shell: pwsh
        run: |
          $url = "https://github.com/aciderix/dh-launcher-winci-test/releases/download/selfcontained-bash-v1/dh-launcher-windows-selfcontained.zip"
          Write-Host "Telechargement via curl.exe natif..."
          & curl.exe -L --fail --retry 3 -o bundle.zip $url
          if ($LASTEXITCODE -ne 0) { Write-Host "curl exit code: $LASTEXITCODE"; exit 1 }
          $size = (Get-Item bundle.zip).Length
          Write-Host "Taille bundle.zip : $size octets"
          if ($size -lt 100000000) { Write-Host "FICHIER TROP PETIT, download rate."; Get-Content bundle.zip -TotalCount 5; exit 1 }
          try {
            Expand-Archive -Path "bundle.zip" -DestinationPath "launcher-windows" -Force -ErrorAction Stop
          } catch {
            Write-Host "ERREUR Expand-Archive :"
            Write-Host $_.Exception.GetType().FullName
            Write-Host $_.Exception.Message
            Write-Host $_.ScriptStackTrace
            throw
          }
          Get-ChildItem launcher-windows | Select-Object Name

      - name: "Telecharge l'APK (meme lien Google Drive)"
        shell: pwsh
        run: |
          python -m pip install --quiet gdown
          python -m gdown "https://drive.google.com/uc?id=1XCapSM-tuDbwGVY4-sT6Rd0md1kTqyHH" -O disney-heroes.xapk

      - name: "Lance SETUP-bash-portable.bat (comme le ferait l'ami une fois)"
        shell: cmd
        run: |
          cd launcher-windows
          call SETUP-bash-portable.bat

      - name: "Verifie bash toujours introuvable nativement, puis simule l'effet du SETUP dans CETTE session (registry ecrit mais PATH courant pas rafraichi automatiquement en CI, contrairement a une vraie session Explorer)"
        shell: pwsh
        run: |
          Write-Host "=== bash natif (doit etre absent, Git cache) ==="
          Get-Command bash -ErrorAction SilentlyContinue
          Write-Host "=== PATH utilisateur en registre (doit contenir runtime\bash) ==="
          [Environment]::GetEnvironmentVariable('PATH','User')
          Write-Host "=== on simule ce qu'une VRAIE session Explorer/GUI ferait : recharger le PATH utilisateur dans CETTE session avant de lancer le launcher ==="
          $userPath = [Environment]::GetEnvironmentVariable('PATH','User')
          $machinePath = [Environment]::GetEnvironmentVariable('PATH','Machine')
          $env:PATH = $userPath + ";" + $machinePath
          Write-Host "bash apres rafraichissement PATH session :"
          Get-Command bash -ErrorAction SilentlyContinue | Format-List
          # sauvegarde pour l'etape suivante (chaque step = nouveau process pwsh, PATH modifie ici ne survit pas seul)
          Add-Content -Path $env:GITHUB_ENV -Value "USERPATH_REFRESHED=$env:PATH"

      - name: "Lance le launcher + build (dans UNE session avec le PATH deja rafraichi comme une vraie ouverture GUI apres SETUP) - timeout 30 min"
        shell: pwsh
        timeout-minutes: 35
        run: |
          $env:PATH = $env:USERPATH_REFRESHED
          Write-Host "bash resolu pour cette session:"
          Get-Command bash -ErrorAction SilentlyContinue | Format-List

          cd launcher-windows
          $bat = (Resolve-Path ".\run-launcher.bat").Path
          $p = Start-Process -FilePath $bat -WorkingDirectory (Get-Location) -PassThru -RedirectStandardOutput "$PWD\launcher-stdout.log" -RedirectStandardError "$PWD\launcher-stderr.log" -WindowStyle Hidden
          Start-Sleep -Seconds 5

          $ready = $false
          for ($i=0; $i -lt 20; $i++) {
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:8090/health" -TimeoutSec 3
              Write-Host "health OK: $($r | ConvertTo-Json)"
              $ready = $true
              break
            } catch {
              Write-Host "pas encore pret ($i) ..."
              Start-Sleep -Seconds 3
            }
          }
          Write-Host "=== stdout launcher ==="
          Get-Content "$PWD\launcher-stdout.log" -ErrorAction SilentlyContinue
          Write-Host "=== stderr launcher ==="
          Get-Content "$PWD\launcher-stderr.log" -ErrorAction SilentlyContinue
          if (-not $ready) { Write-Host "=== launcher jamais pret, abandon ==="; exit 1 }

          $apkPath = (Resolve-Path "..\disney-heroes.xapk").Path
          $body = "apkPath=$([uri]::EscapeDataString($apkPath))&target=server&full=true&pkg=true"
          $resp = Invoke-RestMethod -Uri "http://127.0.0.1:8090/build/start" -Method Post -Body $body -ContentType "application/x-www-form-urlencoded"
          Write-Host ($resp | ConvertTo-Json -Depth 5)

          $deadline = (Get-Date).AddMinutes(30)
          $lastLen = 0
          $final = "TIMEOUT"
          while ((Get-Date) -lt $deadline) {
            $st = Invoke-RestMethod -Uri "http://127.0.0.1:8090/build/status" -TimeoutSec 10
            $log = $st.log
            if ($log.Length -gt $lastLen) {
              Write-Host $log.Substring($lastLen)
              $lastLen = $log.Length
            }
            if ($st.state -eq "DONE") { $final = "DONE"; break }
            if ($st.state -eq "FAILED") { $final = "FAILED (step=$($st.step))"; break }
            Start-Sleep -Seconds 10
          }
          Write-Host "=== RESULTAT FINAL: $final ==="
          if ($final -ne "DONE") { exit 1 }

      - name: "DEBUG si echec"
        if: always()
        shell: pwsh
        run: |
          cd launcher-windows
          Get-Content "launcher-stdout.log" -ErrorAction SilentlyContinue
          Get-Content "launcher-stderr.log" -ErrorAction SilentlyContinue

      - name: "Upload logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dh-selfcontained-debug-logs
          path: |
            launcher-windows/launcher-stdout.log
            launcher-windows/launcher-stderr.log
          if-no-files-found: warn
          retention-days: 14
